name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: OFF
            tsan: OFF
          - name: Debug + ASan/UBSan
            build_type: Debug
            sanitize: ON
            tsan: OFF
          - name: Debug + TSan
            build_type: Debug
            sanitize: OFF
            tsan: ON

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libfuse3-dev libssl-dev pkg-config fuse3

    - name: Enable FUSE
      run: |
        sudo modprobe fuse || true
        ls -l /dev/fuse

    - name: Configure
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DENCFS_WERROR=ON
        -DENCFS_SANITIZE=${{ matrix.sanitize }}
        -DENCFS_TSAN=${{ matrix.tsan }}
        -DENCFS_E2E=ON

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Test (unit, integration, FUSE end-to-end, browser cross-check)
      env:
        TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      run: ctest --test-dir build --output-on-failure

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Lint shell scripts
      run: shellcheck tools/cloudcli_stub tests/e2e/run_e2e.sh tests/web/run_cross_check.sh run_and_prove.sh
