name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release
            build_type: Release
            sanitize: OFF
            tsan: OFF
          - name: Debug + ASan/UBSan
            build_type: Debug
            sanitize: ON
            tsan: OFF
          - name: Debug + TSan
            build_type: Debug
            sanitize: OFF
            tsan: ON

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        # The runner image's Microsoft repo sometimes returns 403 and fails
        # `apt-get update`; we don't need it.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libfuse3-dev libssl-dev pkg-config fuse3

    - name: Enable FUSE
      run: |
        sudo modprobe fuse || true
        ls -l /dev/fuse

    - name: Configure
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DENCFS_WERROR=ON
        -DENCFS_SANITIZE=${{ matrix.sanitize }}
        -DENCFS_TSAN=${{ matrix.tsan }}
        -DENCFS_E2E=ON

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Test (unit, integration, FUSE end-to-end, browser cross-check)
      env:
        TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
      run: ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzz (libFuzzer, 60 s per target)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        # The runner image's Microsoft repo sometimes returns 403 and fails
        # `apt-get update`; we don't need it.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt-get install -y clang libclang-rt-18-dev cmake libfuse3-dev libssl-dev pkg-config

    - name: Build fuzz targets
      run: |
        CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DENCFS_FUZZ=ON -DENCFS_FUZZ_SECONDS=60
        cmake --build build -j"$(nproc)" --target fuzz_blob fuzz_index fuzz_contents fuzz_journal fuzz_segments

    - name: Fuzz
      run: ctest --test-dir build -R '^fuzz_' --output-on-failure -j4

    - name: Upload crashing inputs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: build/crash-*

  shellcheck:
    name: Lint (shellcheck, actionlint)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Lint shell scripts
      run: shellcheck tools/cloudcli_stub tests/e2e/run_e2e.sh tests/web/run_cross_check.sh run_and_prove.sh
    - name: Lint workflows
      run: |
        pip install actionlint-py
        actionlint
